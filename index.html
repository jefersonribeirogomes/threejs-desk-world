<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Desk Playground - Fire Engine Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #d8d4cf;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    canvas.webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      display: block;
    }
    #ui-overlay {
      position: fixed;
      top: 18px;
      left: 18px;
      color: #e8eaed;
      background: rgba(24, 26, 30, 0.88);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.12);
      max-width: 340px;
    }
    #ui-overlay h1 {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #ff5722;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #ui-overlay p {
      font-size: 12.5px;
      line-height: 1.45;
      color: #c4c9d0;
      margin-bottom: 6px;
    }
    .keys-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .keys {
      font-weight: 700;
      background: #2d3139;
      border: 1px solid #454b57;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 11px;
      color: #35d0ba;
    }
    #cam-controls {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    .btn-cam {
      background: #2b3038;
      color: #fff;
      border: 1px solid #48505e;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-cam:hover, .btn-cam.active {
      background: #ff5722;
      border-color: #ff784e;
    }
    #interaction-prompt {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 20, 24, 0.94);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.2px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      border: 1px solid rgba(53, 208, 186, 0.5);
      pointer-events: none;
      z-index: 20;
    }
    #interaction-prompt span.badge {
      background: #ff481c;
      color: #fff;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
    }
  </style>
  <script src="./three.min.js"></script>
</head>
<body>
  <div id="ui-overlay">
    <h1>🚒 //Fire Engine// Desk World</h1>
    <p>Seu setup real expandido em 3D + o carrinho de bombeiro do seu filho!</p>
    <div class="keys-row">
      <span class="keys">W A S D / Setas</span> Dirigir
      <span class="keys">Espaço</span> Botão Amarelo (Esguicho!)
      <span class="keys">Scroll</span> Zoom
    </div>
    <div id="cam-controls">
      <button class="btn-cam active" id="btn-cam-iso">Visão Mesa</button>
      <button class="btn-cam" id="btn-cam-close">Close no Carrinho</button>
      <button class="btn-cam" id="btn-cam-wide">Visão Geral Setup</button>
    </div>
  </div>

  <div id="interaction-prompt">
    <span id="prompt-title">NOTEBOOK ACER NITRO V15</span>
    <span class="badge">ENTER ↵</span>
  </div>

  <canvas class="webgl"></canvas>

  <script>
    const canvas = document.querySelector('canvas.webgl');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdcd7d0); // Parede clara do quarto da foto

    const sizes = {
      width: window.innerWidth,
      height: window.innerHeight
    };

    // Câmera Perspectiva com FOV baixo (estilo isométrico moderno com profundidade real)
    const camera = new THREE.PerspectiveCamera(32, sizes.width / sizes.height, 0.5, 250);
    let camMode = 'iso'; // 'iso', 'close', 'wide'
    let zoomFactor = 1.0;

    window.addEventListener('wheel', (e) => {
      zoomFactor = Math.max(0.45, Math.min(1.75, zoomFactor + e.deltaY * 0.0008));
    });

    document.getElementById('btn-cam-iso').addEventListener('click', (e) => {
      camMode = 'iso';
      zoomFactor = 1.0;
      setActiveBtn(e.target);
    });
    document.getElementById('btn-cam-close').addEventListener('click', (e) => {
      camMode = 'close';
      zoomFactor = 0.7;
      setActiveBtn(e.target);
    });
    document.getElementById('btn-cam-wide').addEventListener('click', (e) => {
      camMode = 'wide';
      zoomFactor = 1.3;
      setActiveBtn(e.target);
    });
    function setActiveBtn(btn) {
      document.querySelectorAll('.btn-cam').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(sizes.width, sizes.height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // --- ILUMINAÇÃO REALISTA DE QUARTO / SETUP ---
    const ambientLight = new THREE.AmbientLight(0xfff8f0, 0.85);
    scene.add(ambientLight);

    // Luz principal de teto/janela
    const mainLight = new THREE.DirectionalLight(0xfffdf8, 1.15);
    mainLight.position.set(14, 38, 24);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 5;
    mainLight.shadow.camera.far = 95;
    const sd = 34;
    mainLight.shadow.camera.left = -sd;
    mainLight.shadow.camera.right = sd;
    mainLight.shadow.camera.top = sd;
    mainLight.shadow.camera.bottom = -sd;
    mainLight.shadow.bias = -0.0004;
    scene.add(mainLight);

    // Luz azulada suave vinda dos monitores
    const screenGlowLight = new THREE.PointLight(0x88b4ff, 0.55, 35);
    screenGlowLight.position.set(2, 10, -10);
    scene.add(screenGlowLight);

    // --- GERADORES DE TEXTURAS PROCEDURAIS (FIÉIS ÀS FOTOS) ---

    // 1. Textura de Feltro Chumbo do Deskmat
    function createFeltTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#383a3d';
      ctx.fillRect(0, 0, 512, 512);
      // Fibras do feltro
      for (let i = 0; i < 18000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const len = 2 + Math.random() * 5;
        const ang = Math.random() * Math.PI * 2;
        ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 2.5);
      return tex;
    }

    // 2. Textura do Para-brisa do Carrinho (Óculos escuros azuis com reflexos brancos + sorrisinho!)
    function createWindshieldTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      // Fundo azul translúcido turquesa do plástico do para-brisa
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#1e95b8');
      grad.addColorStop(1, '#31b3d4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      // Moldura interna suave
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 10;
      ctx.strokeRect(12, 12, 488, 232);

      // Óculos escuros (Lente esquerda e Lente direita + ponte)
      ctx.fillStyle = '#0d4a85';
      ctx.strokeStyle = '#093561';
      ctx.lineWidth = 8;

      // Lente esquerda
      ctx.beginPath();
      ctx.roundRect(75, 55, 155, 110, [18, 18, 45, 35]);
      ctx.fill();
      ctx.stroke();

      // Lente direita
      ctx.beginPath();
      ctx.roundRect(282, 55, 155, 110, [18, 18, 35, 45]);
      ctx.fill();
      ctx.stroke();

      // Ponte dos óculos
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(225, 88);
      ctx.quadraticCurveTo(256, 75, 287, 88);
      ctx.stroke();

      // Listras brancas diagonais de reflexo nos óculos (exatamente como no brinquedo!)
      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'round';

      // Reflexos lente esquerda
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.moveTo(115, 78);
      ctx.lineTo(150, 140);
      ctx.stroke();

      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(155, 75);
      ctx.lineTo(182, 125);
      ctx.stroke();

      // Reflexos lente direita
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.moveTo(322, 78);
      ctx.lineTo(357, 140);
      ctx.stroke();

      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(362, 75);
      ctx.lineTo(389, 125);
      ctx.stroke();

      // Sorrisinho fofo no centro abaixo dos óculos
      ctx.strokeStyle = '#08325c';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(256, 172, 18, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      return new THREE.CanvasTexture(c);
    }

    // 3. Textura Lateral do Carrinho (Janela amarela arredondada + 3 barras + //Fire Engine//)
    function createCarSideTexture(flip = false) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      if (flip) {
        ctx.translate(512, 0);
        ctx.scale(-1, 1);
      }

      // Fundo laranja-avermelhado vivo do caminhãozinho
      ctx.fillStyle = '#ff471a';
      ctx.fillRect(0, 0, 512, 256);

      // Janela lateral amarela com topo arredondado
      ctx.fillStyle = '#ffd15c';
      ctx.beginPath();
      ctx.roundRect(75, 48, 86, 95, [42, 42, 10, 10]);
      ctx.fill();

      // 3 barras verticais amarelas crescentes ao lado da janela
      const barHeights = [46, 68, 92];
      barHeights.forEach((bh, idx) => {
        ctx.beginPath();
        ctx.roundRect(195 + idx * 38, 143 - bh, 22, bh, 10);
        ctx.fill();
      });

      // Nervuras traseiras em relevo (escada/compartimento)
      ctx.strokeStyle = '#d9340d';
      ctx.lineWidth = 6;
      for (let i = 0; i < 3; i++) {
        ctx.strokeRect(338 + i * 42, 55, 30, 88);
      }

      // Faixa branca inferior com texto "// Fire Engine //"
      ctx.fillStyle = '#ffffff';
      ctx.font = 'italic 900 28px "Segoe UI", Arial, sans-serif';
      ctx.fillText('// Fire Engine //', 85, 205);

      return new THREE.CanvasTexture(c);
    }

    // 4. Textura do Monitor Ultrawide Curvo (Split Screen: Chat escuro à esquerda + Cena 3D laranja à direita!)
    function createUltrawideScreenTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 420;
      const ctx = c.getContext('2d');

      // Metade esquerda: Interface Dark Mode (Antigravity / VS Code)
      ctx.fillStyle = '#141619';
      ctx.fillRect(0, 0, 480, 420);
      // Sidebar
      ctx.fillStyle = '#1c1f24';
      ctx.fillRect(0, 0, 95, 420);
      // Linhas de texto simuladas no chat
      ctx.fillStyle = '#e0e6ed';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Antigravity - Three.js Setup', 115, 42);
      ctx.fillStyle = '#8b949e';
      for (let i = 0; i < 14; i++) {
        const w = 140 + ((i * 53) % 180);
        ctx.fillRect(115, 65 + i * 22, w, 8);
      }

      // Metade direita: Duas janelas lado a lado com a cena laranja do Bruno Simon!
      ctx.fillStyle = '#f5a274';
      ctx.fillRect(480, 0, 544, 420);
      // Divisória central
      ctx.fillStyle = '#202225';
      ctx.fillRect(745, 0, 6, 420);
      // Água azul-turquesa no canto
      ctx.fillStyle = '#68c3c8';
      ctx.beginPath();
      ctx.moveTo(480, 260);
      ctx.lineTo(745, 350);
      ctx.lineTo(745, 420);
      ctx.lineTo(480, 420);
      ctx.fill();
      // Cards brancos no topo das telas
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(500, 35, 110, 48);
      ctx.fillRect(768, 35, 110, 48);
      // Carrinho vermelho e árvores laranjas na tela
      ctx.fillStyle = '#d93829';
      ctx.fillRect(560, 230, 40, 26);
      ctx.fillRect(880, 210, 40, 26);
      ctx.fillStyle = '#e86f38';
      ctx.beginPath();
      ctx.arc(830, 255, 28, 0, Math.PI * 2);
      ctx.arc(870, 245, 22, 0, Math.PI * 2);
      ctx.fill();

      // Barra de título do navegador
      ctx.fillStyle = '#20232a';
      ctx.fillRect(0, 0, 1024, 22);

      return new THREE.CanvasTexture(c);
    }

    // 5. Textura da Tela do Notebook Acer Nitro (Windows Explorer Dark Mode)
    function createLaptopScreenTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 320;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#191b1f';
      ctx.fillRect(0, 0, 512, 320);
      // Barra lateral do Explorer
      ctx.fillStyle = '#21242b';
      ctx.fillRect(0, 24, 110, 276);
      // Pastas e arquivos listados
      ctx.fillStyle = '#f0c674';
      for (let i = 0; i < 10; i++) {
        ctx.fillRect(130, 50 + i * 18, 14, 10);
        ctx.fillStyle = '#abb2bf';
        ctx.fillRect(152, 52 + i * 18, 120 + (i % 3) * 40, 6);
        ctx.fillStyle = '#f0c674';
      }
      // Barra de tarefas do Windows
      ctx.fillStyle = '#111317';
      ctx.fillRect(0, 300, 512, 20);
      return new THREE.CanvasTexture(c);
    }

    // 6. Textura do Adesivo Hexagonal Colorido do Apoio de Pulso do Teclado
    function createHexStickerTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 128);

      const grad = ctx.createLinearGradient(20, 20, 236, 108);
      grad.addColorStop(0, '#26d0ce');
      grad.addColorStop(0.35, '#a770ef');
      grad.addColorStop(0.7, '#cf8bf3');
      grad.addColorStop(1, '#fdb99b');

      ctx.fillStyle = grad;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.roundRect(24, 18, 208, 92, 36);
      ctx.fill();
      ctx.stroke();
      return new THREE.CanvasTexture(c);
    }

    // 7. Textura do Adesivo de Coração Quebra-Cabeça (Autismo) no Notebook
    function createHeartStickerTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      // Função auxiliar para caminho de coração
      function heartPath(cx, cy, size) {
        ctx.beginPath();
        ctx.moveTo(cx, cy + size * 0.35);
        ctx.bezierCurveTo(cx, cy, cx - size * 0.5, cy, cx - size * 0.5, cy + size * 0.35);
        ctx.bezierCurveTo(cx - size * 0.5, cy + size * 0.7, cx, cy + size * 0.9, cx, cy + size * 1.15);
        ctx.bezierCurveTo(cx, cy + size * 0.9, cx + size * 0.5, cy + size * 0.7, cx + size * 0.5, cy + size * 0.35);
        ctx.bezierCurveTo(cx + size * 0.5, cy, cx, cy, cx, cy + size * 0.35);
        ctx.closePath();
      }

      // Borda branca do adesivo em formato de coração
      heartPath(64, 14, 92);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Recorte interno para peças coloridas do quebra-cabeça
      ctx.save();
      heartPath(64, 20, 80);
      ctx.clip();
      const cols = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#ff7f50'];
      for (let r = 0; r < 4; r++) {
        for (let col = 0; col < 4; col++) {
          ctx.fillStyle = cols[(r * 4 + col) % cols.length];
          ctx.fillRect(16 + col * 24, 16 + r * 26, 25, 27);
        }
      }
      ctx.restore();

      heartPath(64, 14, 92);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      return new THREE.CanvasTexture(c);
    }

    // ============================================================================
    // CONSTRUÇÃO DO MUNDO: A SUA MESA DE TRABALHO EXPANDIDA
    // ============================================================================
    const deskWorld = new THREE.Group();
    scene.add(deskWorld);

    // 1. Tampo da Mesa Preta com Recorte Ergonômico Frontal (Expandido para 64 x 38)
    const deskMat = new THREE.MeshStandardMaterial({
      color: 0x1a1c1f,
      roughness: 0.42,
      metalness: 0.1
    });
    const deskTop = new THREE.Mesh(new THREE.BoxGeometry(64, 1.4, 38), deskMat);
    deskTop.position.set(0, -0.7, 0);
    deskTop.receiveShadow = true;
    deskTop.castShadow = true;
    deskWorld.add(deskTop);

    // Painel de controle da mesa com regulagem de altura (^ v) na borda frontal esquerda (igual à foto!)
    const deskCtrl = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.7, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.3 })
    );
    deskCtrl.position.set(-24, -0.5, 19.1);
    deskWorld.add(deskCtrl);

    // Pernas pretas metálicas da mesa
    const legMat = new THREE.MeshStandardMaterial({ color: 0x121316, roughness: 0.3, metalness: 0.6 });
    const legL = new THREE.Mesh(new THREE.BoxGeometry(2.2, 24, 2.2), legMat);
    legL.position.set(-25, -12.7, 8);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(2.2, 24, 2.2), legMat);
    legR.position.set(25, -12.7, 8);
    deskWorld.add(legL, legR);

    // 2. Deskmat de Feltro Cinza-Chumbo (Grande, ocupando o centro-direita da mesa)
    const feltMat = new THREE.MeshStandardMaterial({
      map: createFeltTexture(),
      roughness: 0.92,
      metalness: 0.0
    });
    const deskmat = new THREE.Mesh(new THREE.BoxGeometry(40, 0.14, 22), feltMat);
    deskmat.position.set(7, 0.07, 4.5);
    deskmat.receiveShadow = true;
    deskWorld.add(deskmat);

    // ============================================================================
    // ELEMENTOS REAIS DA SUA MESA (POSICIONADOS COM ESPAÇO PARA DIRIGIR)
    // ============================================================================
    const obstacles = []; // Lista de bounding boxes circulares/retangulares para colisão suave

    // 3. COPO TÉRMICO BRANCO (Tipo Stanley com borda inox na esquerda frontal)
    const tumblerGroup = new THREE.Group();
    const tumblerBody = new THREE.Mesh(
      new THREE.CylinderGeometry(1.85, 1.4, 5.8, 28),
      new THREE.MeshStandardMaterial({ color: 0xf2f4f7, roughness: 0.25 })
    );
    tumblerBody.position.y = 3.2;
    tumblerBody.castShadow = true;
    tumblerBody.receiveShadow = true;

    const tumblerBaseRim = new THREE.Mesh(
      new THREE.CylinderGeometry(1.42, 1.38, 0.5, 28),
      new THREE.MeshStandardMaterial({ color: 0xcfd6de, metalness: 0.85, roughness: 0.18 })
    );
    tumblerBaseRim.position.y = 0.25;

    const tumblerTopRim = new THREE.Mesh(
      new THREE.CylinderGeometry(1.88, 1.85, 0.45, 28),
      new THREE.MeshStandardMaterial({ color: 0xd8dfe6, metalness: 0.85, roughness: 0.18 })
    );
    tumblerTopRim.position.y = 6.1;

    const tumblerInner = new THREE.Mesh(
      new THREE.CylinderGeometry(1.72, 1.72, 0.1, 24),
      new THREE.MeshStandardMaterial({ color: 0x7a828a, metalness: 0.7, roughness: 0.3 })
    );
    tumblerInner.position.y = 6.28;

    tumblerGroup.add(tumblerBody, tumblerBaseRim, tumblerTopRim, tumblerInner);
    tumblerGroup.position.set(-24, 0, 11);
    deskWorld.add(tumblerGroup);
    obstacles.push({ x: -24, z: 11, r: 2.3, name: 'COPO TÉRMICO STANLEY BRANCO' });

    // 4. NOTEBOOK ACER NITRO V 15 NO SUPORTE INCLINADO (Esquerda-Traseira)
    const laptopGroup = new THREE.Group();
    const laptopChassisMat = new THREE.MeshStandardMaterial({ color: 0x24272c, roughness: 0.38, metalness: 0.35 });

    // Suporte elevatório sob o notebook
    const standBase = new THREE.Mesh(new THREE.BoxGeometry(11, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0x16181b }));
    standBase.position.set(0, 1.1, 0);
    standBase.castShadow = true;
    laptopGroup.add(standBase);

    // Base do teclado do notebook (inclinada para frente como na foto)
    const lapBaseGroup = new THREE.Group();
    lapBaseGroup.position.set(0, 2.6, 0.5);
    lapBaseGroup.rotation.x = 0.32;

    const lapDeck = new THREE.Mesh(new THREE.BoxGeometry(14.5, 0.5, 10.2), laptopChassisMat);
    lapDeck.castShadow = true;
    lapDeck.receiveShadow = true;
    lapBaseGroup.add(lapDeck);

    // Teclas do notebook
    const lapKeys = new THREE.Mesh(
      new THREE.BoxGeometry(13.2, 0.15, 5.4),
      new THREE.MeshStandardMaterial({ color: 0x141619, roughness: 0.6 })
    );
    lapKeys.position.set(0, 0.28, -1.2);
    lapBaseGroup.add(lapKeys);

    // Touchpad do notebook
    const touchpad = new THREE.Mesh(
      new THREE.BoxGeometry(3.8, 0.08, 2.6),
      new THREE.MeshStandardMaterial({ color: 0x2f333a, roughness: 0.3 })
    );
    touchpad.position.set(-1.1, 0.27, 3.1);
    lapBaseGroup.add(touchpad);

    // Adesivos do Notebook (Intel Azul, RTX Verde e Coração Quebra-Cabeça Colorido!)
    const stickerIntel = new THREE.Mesh(
      new THREE.PlaneGeometry(0.8, 0.65),
      new THREE.MeshBasicMaterial({ color: 0x0071c5 })
    );
    stickerIntel.rotation.x = -Math.PI / 2;
    stickerIntel.position.set(-5.8, 0.28, 2.3);

    const stickerRtx = new THREE.Mesh(

      carOrangeMat
    );
    roofButtonRim.position.set(0, 2.42, 0.55);
    carBodyGroup.add(roofButtonRim);

    const yellowRoofButton = new THREE.Mesh(
      new THREE.CylinderGeometry(0.23, 0.23, 0.16, 24),
      yellowDetailMat
    );
    yellowRoofButton.position.set(0, 2.48, 0.55);
    carBodyGroup.add(yellowRoofButton);

    // Domo e Canhão de Água de Bombeiro no teto traseiro (bem visível acima do teto!)
    const turretGroup = new THREE.Group();
    turretGroup.position.set(0, 2.38, -0.45);

    const turretDome = new THREE.Mesh(
      new THREE.SphereGeometry(0.56, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.62),
      carOrangeMat
    );
    turretDome.castShadow = true;
    turretGroup.add(turretDome);

    const nozzleBarrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.10, 0.13, 0.75, 16),
      carOrangeMat
    );
    nozzleBarrel.rotation.x = Math.PI / 2.8;
    nozzleBarrel.position.set(0, 0.45, 0.32);
    turretGroup.add(nozzleBarrel);

    carBodyGroup.add(turretGroup);

    // 7. As 4 Rodinhas com Calotas Azul-Turquesa (Ciano)
    const wheelPositions = [
      [-1.18, 0.44, 0.98],
      [1.18, 0.44, 0.98],
      [-1.18, 0.44, -0.98],
      [1.18, 0.44, -0.98]
    ];
    const wheels = [];

    wheelPositions.forEach((pos) => {
      const wGroup = new THREE.Group();
      wGroup.position.set(...pos);

      // Pneu escuro
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.30, 24), tireDarkMat);
      tire.rotation.z = Math.PI / 2;
      tire.castShadow = true;
      wGroup.add(tire);

      // Calota Ciano/Turquesa característica do brinquedo!
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.33, 24), cyanWheelMat);
      rim.rotation.z = Math.PI / 2;
      wGroup.add(rim);

      vehicle.add(wGroup);
      wheels.push(wGroup);
    });

    // Posicionar o carrinho no Deskmat virado em 3/4 para a câmera (igual ao ângulo da foto!)
    vehicle.position.set(11.5, 0.14, 11.5);
    vehicle.rotation.y = -0.55;
    scene.add(vehicle);

    // ============================================================================
    // SISTEMA DE PARTÍCULAS DE ÁGUA (QUANDO APERTA O BOTÃO AMARELO DO CARRINHO!)
    // ============================================================================
    const waterDrops = [];
    const dropGeo = new THREE.SphereGeometry(0.16, 8, 8);
    const dropMat = new THREE.MeshBasicMaterial({ color: 0x35e0ff });

    function spawnWaterJet() {
      // Anima o botão amarelo afundando
      yellowRoofButton.position.y = 2.42;
      setTimeout(() => { yellowRoofButton.position.y = 2.48; }, 150);

      for (let i = 0; i < 4; i++) {
        const drop = new THREE.Mesh(dropGeo, dropMat);
        const forward = new THREE.Vector3(Math.sin(carAngle), 0.42 + Math.random() * 0.15, Math.cos(carAngle));
        drop.position.copy(vehicle.position).add(new THREE.Vector3(0, 2.95, 0));
        scene.add(drop);
        waterDrops.push({
          mesh: drop,
          vel: forward.multiplyScalar(0.42 + Math.random() * 0.12).add(
            new THREE.Vector3((Math.random() - 0.5) * 0.08, 0, (Math.random() - 0.5) * 0.08)
          ),
          life: 45
        });
      }
    }

    // ============================================================================
    // CONTROLES E FÍSICA SUAVE DO CARRINHO SOBRE A MESA
    // ============================================================================
    const keys = { forward: false, backward: false, left: false, right: false, spray: false };

    window.addEventListener('keydown', (e) => {
      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.forward = true;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.backward = true;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.left = true;
      if (['KeyD', 'ArrowRight'].includes(e.code)) keys.right = true;
      if (e.code === 'Space') {
        keys.spray = true;
        spawnWaterJet();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['KeyW', 'ArrowUp'].includes(e.code)) keys.forward = false;
      if (['KeyS', 'ArrowDown'].includes(e.code)) keys.backward = false;
      if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.left = false;
      if (['KeyD', 'ArrowRight'].includes(e.code)) keys.right = false;
      if (e.code === 'Space') keys.spray = false;
    });

    let carSpeed = 0;
    let carAngle = -0.55;
    const maxSpeed = 0.28;
    const acceleration = 0.014;
    const friction = 0.92;
    const turnSpeed = 0.048;

    const promptEl = document.getElementById('interaction-prompt');
    const promptTitleEl = document.getElementById('prompt-title');

    window.addEventListener('resize', () => {
      sizes.width = window.innerWidth;
      sizes.height = window.innerHeight;
      camera.aspect = sizes.width / sizes.height;
      camera.updateProjectionMatrix();
      renderer.setSize(sizes.width, sizes.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Aceleração e direção
      if (keys.forward) carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
      else if (keys.backward) carSpeed = Math.max(carSpeed - acceleration, -maxSpeed * 0.65);
      else carSpeed *= friction;

      if (Math.abs(carSpeed) > 0.004) {
        const dir = carSpeed > 0 ? 1 : -1;
        if (keys.left) carAngle += turnSpeed * dir;
        if (keys.right) carAngle -= turnSpeed * dir;
      }

      // Próxima posição candidata
      let nextX = vehicle.position.x + Math.sin(carAngle) * carSpeed;
      let nextZ = vehicle.position.z + Math.cos(carAngle) * carSpeed;

      // Limites seguros da mesa (para o carrinho não cair da borda)
      nextX = Math.max(-29, Math.min(29, nextX));
      nextZ = Math.max(-16, Math.min(16.5, nextZ));

      // Colisão suave com objetos redondos da mesa + detecção de proximidade
      let nearestItem = null;
      let minDist = Infinity;

      obstacles.forEach((obs) => {
        const dx = nextX - obs.x;
        const dz = nextZ - obs.z;
        const dist = Math.hypot(dx, dz);
        const minAllowed = obs.r + 1.45;
        if (dist < minAllowed && dist > 0.001) {
          const pushFactor = (minAllowed - dist) / dist;
          nextX += dx * pushFactor;
          nextZ += dz * pushFactor;
          carSpeed *= 0.85;
        }
        if (dist < obs.r + 4.8 && dist < minDist) {
          minDist = dist;
          nearestItem = obs.name;
        }
      });

      // Subir de forma divertida sobre o teclado mecânico e o deskmat!
      let targetY = 0;
      // Verifica se está sobre o Deskmat
      if (nextX > -13 && nextX < 27 && nextZ > -6.5 && nextZ < 15.5) {
        targetY = 0.14;
      }
      // Verifica se está passando por cima do Teclado Mecânico (rampa divertida!)
      if (nextX > -3.2 && nextX < 12.2 && nextZ > 0.8 && nextZ < 7.2) {
        targetY = 0.78 + Math.sin(nextX * 4) * 0.05; // Trepidação gostosa passando pelas teclas!
        if (!nearestItem) nearestItem = 'TECLADO MECÂNICO (PASSANDO POR CIMA DAS TECLAS!)';
      }

      vehicle.position.x = nextX;
      vehicle.position.z = nextZ;
      vehicle.position.y += (targetY - vehicle.position.y) * 0.25;
      vehicle.rotation.y = carAngle;

      // Balanço fofo da carroceria ao acelerar/virar (estilo brinquedo)
      carBodyGroup.rotation.x = -carSpeed * 0.28;
      carBodyGroup.rotation.z = (keys.left ? 0.06 : keys.right ? -0.06 : 0) * (Math.abs(carSpeed) / maxSpeed);

      // Giro das rodinhas ciano
      wheels.forEach((w, idx) => {
        w.rotation.x += carSpeed * 1.9;
        if (idx < 2) {
          const steer = keys.left ? 0.35 : keys.right ? -0.35 : 0;
          w.rotation.y = steer;
        }
      });

      // Atualiza gotinhas do canhão de água
      if (keys.spray && Math.random() > 0.5) spawnWaterJet();
      for (let i = waterDrops.length - 1; i >= 0; i--) {
        const d = waterDrops[i];
        d.mesh.position.add(d.vel);
        d.vel.y -= 0.022; // Gravidade
        d.life--;
        if (d.mesh.position.y < 0.2 || d.life <= 0) {
          scene.remove(d.mesh);
          waterDrops.splice(i, 1);
        }
      }

      // Exibir badge interativo quando perto de algum item da sua mesa
      if (nearestItem) {
        promptTitleEl.textContent = nearestItem;
        promptEl.style.display = 'flex';
      } else {
        promptEl.style.display = 'none';
      }

      // Câmera dinâmica conforme o modo escolhido
      let camOffset, lookTarget;
      if (camMode === 'close') {
        // Ângulo 3/4 frontal-lateral idêntico à foto do brinquedo!
        const viewAngle = carAngle - 0.52;
        camOffset = new THREE.Vector3(
          Math.sin(viewAngle) * 8.2 * zoomFactor,
          4.8 * zoomFactor,
          Math.cos(viewAngle) * 8.2 * zoomFactor
        );
        lookTarget = new THREE.Vector3(vehicle.position.x, vehicle.position.y + 1.25, vehicle.position.z);
      } else if (camMode === 'wide') {
        camOffset = new THREE.Vector3(0, 32 * zoomFactor, 48 * zoomFactor);
        lookTarget = new THREE.Vector3(0, 2, -1);
      } else {
        // Visão Mesa Isométrica seguindo o carrinho suavemente
        camOffset = new THREE.Vector3(16 * zoomFactor, 22 * zoomFactor, 28 * zoomFactor);
        lookTarget = new THREE.Vector3(vehicle.position.x * 0.65, 1.0, vehicle.position.z * 0.65);
      }

      const desiredCamPos = lookTarget.clone().add(camOffset);
      camera.position.lerp(desiredCamPos, 0.08);
      camera.lookAt(lookTarget);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
